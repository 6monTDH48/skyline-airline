<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline — Simulateur de compagnie aérienne</title>
<style>
:root{
  --paper:#f2ece0; --panel:#fbf7ef; --panel2:#f5eee0;
  --card:#ffffff; --card2:#faf4e8;
  --track:#e6ddc8; --track2:#d8cdb2; --hover:#faf4e6;
  --ink:#241f19; --ink2:#5b5344; --ink3:#8d8272;
  --line:#d4c8b1; --line2:#e6dcc7;
  --navy:#1f4e79; --navy2:#2f6fa8; --navy3:#7fa9cf;
  --btn1:#2a5f8f; --btn2:#1a4368; --btn-line:#1a4368;
  --gold:#a67c1a; --gold2:#c69a2a; --red:#a63a2b; --green:#3d7a4e;
  --glass1:rgba(253,250,244,.96); --glass2:rgba(245,238,224,.94);
  --head1:#fdfaf4; --head2:#f2ebdc;
  --scroll:#d0c2a7; --scroll-h:#bda98a;
  --shadow:0 8px 30px rgba(60,45,20,.16);
  --shadow-s:0 2px 8px rgba(80,60,20,.12);
  --font-s:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --font-n:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--font-n);font-size:14px;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
button{font-family:inherit;font-size:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}
::selection{background:rgba(31,78,121,.2)}


/* ------------------------------------------------------------ thème sombre */
html.dark{
  --paper:#0d151c; --panel:#141d25; --panel2:#1a242d;
  --card:#18222b; --card2:#1d2831;
  --track:#202c36; --track2:#2a3843; --hover:#1f2b35;
  --ink:#dfe7ee; --ink2:#9fb0bd; --ink3:#74858f;
  --line:#2b3a45; --line2:#22303a;
  --navy:#4f9ad6; --navy2:#6bb0e6; --navy3:#356b96;
  --btn1:#2f6f9f; --btn2:#1f4e73; --btn-line:#2a5f8a;
  --gold:#d2a642; --gold2:#e6bd57; --red:#d76a55; --green:#5fae72;
  --glass1:rgba(20,29,37,.94); --glass2:rgba(15,22,29,.92);
  --head1:#18222b; --head2:#111a22;
  --scroll:#2e3d49; --scroll-h:#3d5060;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --shadow-s:0 2px 10px rgba(0,0,0,.4);
}
html.dark .tag{background:#243039;color:var(--ink2)}
html.dark .tag.ok{background:#1d3527;color:#79c48d}
html.dark .tag.bad{background:#3a2320;color:#e8907c}
html.dark .tag.warn{background:#3a3120;color:#dcb45e}
html.dark .tag.hub{background:#1e3446;color:#7dbbe8}
html.dark #legend .lg:nth-child(1) .sw{background:#4f9ad6 !important}
html.dark #legend .lg:nth-child(2) .sw{background:#e8524a !important}
html.dark #legend .lg:nth-child(3) .sw{background:#a284d0 !important}
html.dark #legend .lg:nth-child(4) .sw{background:#3f6f92 !important}
html.dark .brand .mk{background:radial-gradient(circle at 34% 28%,#4f9ad6,#1f4e73 68%)}
html.dark .speeds button.on,html.dark #toolbar button.on{box-shadow:0 2px 6px rgba(0,0,0,.5)}
html.dark #dockclose:hover{background:var(--red);color:#0d151c}
html.dark .lbar,html.dark .splitbar,html.dark .bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
html.dark #tip{background:linear-gradient(180deg,rgba(30,42,52,.97),rgba(20,30,38,.97));
  border-color:rgba(255,255,255,.12)}
html.dark #modal{background:rgba(4,8,12,.62)}
html.dark input:focus,html.dark select:focus{box-shadow:0 0 0 3px rgba(79,154,214,.22)}
html.dark option{background:var(--card);color:var(--ink)}

/* ---------------------------------------------------------------- carte -- */
#map{position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:grab}
#map.dragging{cursor:grabbing}
#map.linking{cursor:crosshair}

/* ------------------------------------------------------------- bandeau --- */
#topbar{position:absolute;top:0;left:0;right:0;height:60px;z-index:20;
  display:flex;align-items:center;padding:0 14px;
  background:linear-gradient(180deg,var(--glass1) 0%,var(--glass2) 100%);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  box-shadow:0 3px 16px rgba(80,60,20,.13)}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(166,124,26,.55),transparent)}
.brand{display:flex;align-items:center;gap:10px;padding-right:16px;margin-right:6px;
  border-right:1px solid var(--line)}
.brand .mk{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;
  font-size:15px;background:radial-gradient(circle at 34% 28%,#3c7cb4,#1a4368 68%);
  box-shadow:0 2px 7px rgba(20,50,80,.4),inset 0 -2px 5px rgba(0,0,0,.28)}
.brand .nm{font-family:var(--font-s);font-size:17.5px;letter-spacing:.2px;line-height:1.05;
  max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .sb{font-size:9.5px;color:var(--ink3);letter-spacing:2px;text-transform:uppercase}
.kpi{padding:0 15px;border-right:1px solid var(--line2);min-width:98px}
.kpi .k{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.3}
.kpi .v small{font-size:11px;font-weight:500;color:var(--ink3)}
.pos{color:var(--green)} .neg{color:var(--red)}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:4px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar > i{display:block;height:100%;border-radius:3px;background:var(--navy2);
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
#clock{margin-left:auto;display:flex;align-items:center;gap:12px;padding-left:14px;
  border-left:1px solid var(--line2)}
#date{font-family:var(--font-s);font-size:15px;min-width:158px;text-align:right;
  transition:color .3s,transform .3s}
#date.pulse{color:var(--gold);transform:scale(1.06)}
.hh{font-size:11px;color:var(--ink3);font-family:var(--font-n);letter-spacing:.4px}
.speeds{display:flex;gap:3px;background:var(--track);padding:3px;border-radius:9px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.speeds button{border:0;background:transparent;color:var(--ink2);padding:5px 9px;border-radius:7px;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;transition:.14s}
.speeds button:hover{background:var(--track2)}
.speeds button.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;
  box-shadow:0 2px 5px rgba(20,50,80,.4)}

/* ------------------------------------------------------------ outils ----- */
#toolbar{position:absolute;left:12px;top:72px;z-index:15;display:flex;flex-direction:column;gap:5px}
#toolbar button{min-width:142px;text-align:left;display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:10px;
  background:linear-gradient(180deg,var(--glass1),var(--glass2));
  backdrop-filter:blur(6px);box-shadow:var(--shadow-s);
  transition:transform .15s,box-shadow .15s,background .15s}
#toolbar button:hover{background:var(--card);transform:translateX(3px);box-shadow:0 4px 14px rgba(80,60,20,.2)}
#toolbar button.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;border-color:var(--btn-line);
  box-shadow:0 4px 14px rgba(20,50,80,.35)}
.ic{width:17px;height:17px;display:inline-grid;place-items:center;flex:none}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.ic svg .f{fill:currentColor;stroke:none}
#toolbar button.on .ic svg{opacity:1}
.brand .mk svg{width:17px;height:17px;fill:#fff;stroke:none}
#toolbar .sep{height:7px}

/* -------------------------------------------------------------- volet ---- */
#dock{position:absolute;right:0;top:60px;bottom:0;width:404px;z-index:18;
  background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-10px 0 34px rgba(80,60,20,.15);display:none;flex-direction:column}
#dock.open{display:flex;animation:dockin .24s cubic-bezier(.2,.8,.2,1)}
@keyframes dockin{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
#dockhead{display:flex;align-items:center;gap:8px;padding:13px 15px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--head1),var(--head2))}
#docktitle{font-family:var(--font-s);font-size:17.5px;flex:1;letter-spacing:.2px}
#dockback{border:0;background:var(--track);width:27px;height:27px;border-radius:50%;
  color:var(--ink2);display:none;place-items:center;padding:0;flex:none;transition:.15s}
#dockback.on{display:grid}
#dockback svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#dockback:hover{background:var(--navy);color:#fff;transform:translateX(-2px)}
#dockclose{border:0;background:var(--track);width:27px;height:27px;border-radius:50%;
  color:var(--ink2);font-size:15px;line-height:1;transition:.15s}
#dockclose:hover{background:var(--red);color:#fff;transform:rotate(90deg)}
#dockbody{flex:1;overflow-y:auto;padding:13px 15px 44px}

/* ------------------------------------------------------- composants ------ */
h4.sec{font-family:var(--font-s);font-size:12.5px;letter-spacing:.6px;color:var(--ink2);
  margin:18px 0 8px;padding-bottom:5px;text-transform:uppercase;
  border-bottom:1px solid var(--line);position:relative}
h4.sec::after{content:"";position:absolute;left:0;bottom:-1px;width:34px;height:1px;background:var(--gold)}
h4.sec:first-child{margin-top:2px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;
  margin-bottom:8px;box-shadow:0 1px 2px rgba(80,60,20,.05);transition:box-shadow .16s,border-color .16s}
.card[data-a]:hover{box-shadow:0 4px 14px rgba(80,60,20,.14);border-color:var(--navy3)}
.card.big{background:linear-gradient(158deg,var(--card) 0%,var(--card2) 100%);border-color:var(--line)}
.card .ttl{font-weight:600;display:flex;align-items:center;gap:6px}
.card .sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px 10px}
.stat{font-size:10.5px;color:var(--ink3);letter-spacing:.2px}
.stat b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;
  font-weight:600;margin-top:1px}
.btn{border:1px solid var(--btn-line);color:#fff;padding:7px 12px;border-radius:8px;font-weight:600;
  font-size:12.5px;background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 2px 5px rgba(20,50,80,.28);transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.12);box-shadow:0 4px 10px rgba(20,50,80,.34);transform:translateY(-1px)}
.btn:active{transform:none;box-shadow:0 1px 3px rgba(20,50,80,.3)}
.btn.gh{background:transparent;color:var(--navy);border-color:var(--navy3);box-shadow:none}
.btn.gh:hover{background:rgba(31,78,121,.08);filter:none}
.btn.warn{background:linear-gradient(180deg,#bd4b3a,#933325);border-color:#933325}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6);transform:none;box-shadow:none}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;background:#ece3ce;color:var(--ink2);font-weight:700}
.tag.ok{background:#dff0e2;color:var(--green)}
.tag.bad{background:#f8ded8;color:var(--red)}
.tag.warn{background:#fbedcd;color:#8a6410}
.tag.hub{background:#dde8f3;color:var(--navy)}
.mini{font-size:11px;color:var(--ink3);line-height:1.55}
.mini.flag{position:relative;padding-left:16px}
.mini.flag::before{content:"";position:absolute;left:1px;top:.45em;width:7px;height:7px;
  border-radius:2px;transform:rotate(45deg)}
.mini.flag.bad{color:var(--red)}
.mini.flag.bad::before{background:var(--red)}
.mini.flag.warn{color:#8a6410}
.mini.flag.warn::before{background:var(--gold)}
.chk{display:inline-block;width:13px;height:13px;border:1.5px solid var(--line);border-radius:4px;
  margin-right:9px;vertical-align:-2px;position:relative;background:var(--card)}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on::after{content:"";position:absolute;left:3.6px;top:.6px;width:3.4px;height:7.4px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(43deg)}
.mini b{color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--ink3);padding:5px 4px;border-bottom:1px solid var(--line);font-weight:700}
table.t td{padding:6px 4px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
table.t tr:hover td{background:var(--hover)}
input[type=text],input[type=number],select{font-family:inherit;font-size:13px;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(47,111,168,.14)}
input[type=range]{width:100%;accent-color:#1f4e79;height:18px}
label.lb{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);
  display:block;margin:11px 0 4px}
.empty{text-align:center;color:var(--ink3);font-size:12.5px;padding:28px 10px;line-height:1.7}
hr.sp{border:0;border-top:1px solid var(--line2);margin:13px 0}

/* --------------------------------------------- comptabilité / graphiques - */
.lrow{margin-bottom:8px}
.lrow-t{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink2)}
.lrow-v{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
.lrow-v i{font-style:normal;color:var(--ink3);font-weight:500;font-size:10.5px;margin-left:3px}
.lrow-s{font-size:10.5px;color:var(--ink3);margin-top:2px}
.lbar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:4px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
.lbar > i{display:block;height:100%;border-radius:4px}
.ltot{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
  font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:8px;
  border-top:1px solid var(--line2)}
.ltot.big{background:linear-gradient(160deg,var(--panel2),var(--track));border:1px solid var(--line);
  border-radius:10px}
.splitbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--track);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.splitbar > i,.splitbar > u,.splitbar > em{display:block;height:100%}
.splitbar > i{background:linear-gradient(180deg,#bd4b3a,#96382a)}
.splitbar > u{background:linear-gradient(180deg,#a3814e,#7d6236)}
.splitbar.tri > i{background:linear-gradient(180deg,var(--btn1),var(--btn2))}
.splitbar.tri > u{background:#8fb4d6}
.splitbar.tri > em{background:#c0997f}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.segbar{display:flex;gap:4px;background:var(--track);padding:3px;border-radius:10px;margin-bottom:9px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.09)}
.segbar button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:8px;
  font-size:11.5px;font-weight:600;color:var(--ink2);transition:.15s}
.segbar button:hover{background:var(--hover)}
.segbar button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:9px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);
  border-radius:7px;padding:6px 8px;transition:.14s;line-height:1.25}
.mod b{font-size:10.5px;font-weight:600;color:var(--ink)}
.mod span{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mod:hover:not(:disabled){border-color:var(--navy2);background:var(--card);
  transform:translateY(-1px);box-shadow:var(--shadow-s)}
.mod.on{border-color:var(--green);background:var(--hover);opacity:.75;cursor:default}
.mod.on b{color:var(--green)}
.minitab{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3);
  background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
.minitab b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

/* ------------------------------------------------------------ messages --- */
#ticker{position:absolute;left:12px;bottom:14px;z-index:16;width:336px;
  display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none}
.msg{border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:9px;
  padding:8px 11px;font-size:12px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,var(--glass1),var(--glass2));
  backdrop-filter:blur(4px);animation:slidein .3s cubic-bezier(.2,.9,.2,1)}
.msg.good{border-left-color:var(--green)}
.msg.bad{border-left-color:var(--red)}
.msg.evt{border-left-color:var(--gold)}
.msg .mt{font-weight:600;font-size:12px}
.msg .md{color:var(--ink3);font-size:11.5px;margin-top:2px;line-height:1.5}
@keyframes slidein{from{opacity:0;transform:translateX(-18px) scale(.97)}to{opacity:1;transform:none}}

/* ----------------------------------------------------------- carte hud --- */
#hud{position:absolute;right:14px;bottom:14px;z-index:16;display:flex;gap:6px;align-items:center;
  transition:right .24s cubic-bezier(.2,.8,.2,1)}
#hud.shift{right:418px}
#hud button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink2);font-size:15px;line-height:1;box-shadow:var(--shadow-s);
  background:linear-gradient(180deg,var(--glass1),var(--glass2));
  backdrop-filter:blur(6px);transition:.15s}
#hud button:hover{background:var(--card);color:var(--navy);transform:translateY(-2px);
  box-shadow:0 5px 14px rgba(80,60,20,.2)}
#opts{position:absolute;right:14px;bottom:56px;z-index:17;display:none;flex-direction:column;gap:2px;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:212px;
  background:linear-gradient(180deg,var(--glass1),var(--glass2));
  backdrop-filter:blur(8px);box-shadow:var(--shadow);transition:right .24s cubic-bezier(.2,.8,.2,1)}
#opts.open{display:flex;animation:pop .2s cubic-bezier(.2,.9,.25,1)}
#opts.shift{right:418px}
.diffs{display:flex;gap:5px;background:var(--track);padding:4px;border-radius:10px}
.diffs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s}
.diffs button:hover{background:var(--hover)}
.diffs button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.16)}
.projs{display:flex;gap:4px;background:var(--track);padding:3px;border-radius:9px}
.projs button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;
  font-size:11px;font-weight:600;color:var(--ink2);transition:.15s}
.projs button:hover{background:var(--hover)}
.projs button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.15)}
#opts{min-width:236px}
#opts .oh{font-family:var(--font-s);font-size:12px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink3);padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
#opts label{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);
  padding:4px 2px;cursor:pointer;border-radius:6px;transition:background .12s}
#opts label:hover{background:rgba(31,78,121,.07);color:var(--ink)}
#opts input{accent-color:#1f4e79;width:14px;height:14px;margin:0;cursor:pointer}
#hud button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;display:block;margin:auto}
#hud button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#legend{position:absolute;right:14px;top:72px;z-index:14;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:11px;color:var(--ink2);box-shadow:var(--shadow-s);
  background:linear-gradient(180deg,var(--glass1),var(--glass2));
  backdrop-filter:blur(6px)}
#legend.hide{display:none}
#legend .lg{display:flex;align-items:center;gap:8px;margin:4px 0}
#legend .sw{width:16px;height:3px;border-radius:2px}
#tip{position:absolute;z-index:30;pointer-events:none;color:#f7f2e7;padding:7px 10px;
  border-radius:8px;font-size:11.5px;display:none;white-space:nowrap;line-height:1.55;
  background:linear-gradient(180deg,rgba(42,36,28,.95),rgba(30,26,20,.95));
  box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.09)}
#tip b{color:#fff}

/* ------------------------------------------------------------- modale ---- */
#modal{position:absolute;inset:0;z-index:60;background:rgba(38,33,28,.5);display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal.open{display:flex;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mbox{background:var(--panel);border-radius:16px;box-shadow:0 26px 70px rgba(0,0,0,.4);
  width:min(600px,92vw);max-height:88vh;overflow:auto;border:1px solid var(--line);
  animation:pop .3s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.mbox .mh{padding:20px 24px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--head1),var(--head2));border-radius:16px 16px 0 0}
.mbox .mh h2{font-family:var(--font-s);margin:0;font-size:25px;font-weight:500;letter-spacing:.2px}
.mbox .mh p{margin:6px 0 0;color:var(--ink3);font-size:12.5px;line-height:1.55}
.mbox .mb{padding:17px 24px}
.mbox .mf{padding:12px 24px 20px;display:flex;gap:8px;justify-content:flex-end}
.choice{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;
  margin-bottom:6px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.choice:hover{border-color:var(--navy2);background:var(--hover);transform:translateX(2px)}
</style>
</head>
<body>
<canvas id="map"></canvas>

<header id="topbar">
  <div class="brand"><div class="mk"><svg viewBox="0 0 16 16"><path class="f" d="M8 1.4c.72 0 1.05.85 1.05 1.75v2.9l4.95 2.95v1.4L9.05 8.95v2.6l1.7 1.3v1.05L8 13.4l-2.75.5v-1.05l1.7-1.3v-2.6L2 10.4V9L6.95 6.05v-2.9C6.95 2.25 7.28 1.4 8 1.4z"/></svg></div><div><div class="nm" id="brandName">Skyline</div><div class="sb">Airlines</div></div></div>
  <div class="kpi"><div class="k">Trésorerie</div><div class="v" id="kCash">—</div></div>
  <div class="kpi"><div class="k">Résultat / mois</div><div class="v" id="kProfit">—</div></div>
  <div class="kpi"><div class="k">Flotte</div><div class="v" id="kFleet">—</div></div>
  <div class="kpi"><div class="k">Réputation</div><div class="v" id="kRep">—</div><div class="bar"><i id="bRep"></i></div></div>
  <div class="kpi"><div class="k">Part de marché</div><div class="v" id="kShare">—</div></div>
  <div class="kpi" style="min-width:152px"><div class="k">Valeur / objectif</div><div class="v" id="kValue">—</div><div class="bar"><i id="bValue"></i></div></div>
  <div id="clock">
    <div id="date">—</div>
    <div class="speeds">
      <button data-sp="0" title="Pause (Espace)">❚❚</button>
      <button data-sp="1" class="on">×1</button>
      <button data-sp="2">×2</button>
      <button data-sp="4">×4</button>
      <button data-sp="8">×8</button>
    </div>
  </div>
</header>

<div id="toolbar">
  <button data-panel="network"><span class="ic"><svg viewBox="0 0 16 16"><circle cx="3.6" cy="4" r="1.7"/><circle cx="12.4" cy="4" r="1.7"/><circle cx="8" cy="12.4" r="1.7"/><path d="M4.9 5.3 6.9 10.8M11.1 5.3 9.1 10.8M5.3 4h5.4"/></svg></span>Réseau</button>
  <button data-panel="fleet"><span class="ic"><svg viewBox="0 0 16 16"><path class="f" d="M8 1.4c.72 0 1.05.85 1.05 1.75v2.9l4.95 2.95v1.4L9.05 8.95v2.6l1.7 1.3v1.05L8 13.4l-2.75.5v-1.05l1.7-1.3v-2.6L2 10.4V9L6.95 6.05v-2.9C6.95 2.25 7.28 1.4 8 1.4z"/></svg></span>Flotte</button>
  <button data-panel="market"><span class="ic"><svg viewBox="0 0 16 16"><path d="M2.2 2.2h5.3L14 8.6 8.6 14 2.2 7.6V2.2z"/><circle cx="5" cy="5" r="1"/></svg></span>Constructeurs</button>
  <button data-panel="finance"><span class="ic"><svg viewBox="0 0 16 16"><rect x="1.6" y="3.6" width="12.8" height="8.8" rx="1.6"/><circle cx="8" cy="8" r="2.2"/><path d="M4 8h.01M12 8h.01"/></svg></span>Finances</button>
  <button data-panel="stats"><span class="ic"><svg viewBox="0 0 16 16"><path d="M2.2 13.8V9.2M6.1 13.8V3.4M9.9 13.8V6.8M13.8 13.8V2.2"/></svg></span>Statistiques</button>
  <button data-panel="rivals"><span class="ic"><svg viewBox="0 0 16 16"><path d="M5 2.2h6v3.4a3 3 0 0 1-6 0V2.2zM5 3.3H3v.9a2 2 0 0 0 2 2M11 3.3h2v.9a2 2 0 0 1-2 2M8 8.6v2.3M5.6 13.8h4.8l-.6-2.9H6.2z"/></svg></span>Concurrence</button>
  <button data-panel="goals"><span class="ic"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.9"/><circle cx="8" cy="8" r="2.9"/><circle class="f" cx="8" cy="8" r=".95"/></svg></span>Objectifs</button>
  <div class="sep"></div>
  <button id="btnSave"><span class="ic"><svg viewBox="0 0 16 16"><path d="M8 2.2v7.6m0 0 2.9-2.9M8 9.8 5.1 6.9M2.4 12.4v1.4h11.2v-1.4"/></svg></span>Sauvegarder</button>
  <button data-panel="help"><span class="ic"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.9"/><path d="M6.25 6.35a1.85 1.85 0 0 1 3.5.75c0 1.25-1.75 1.45-1.75 2.7"/><circle class="f" cx="8" cy="11.9" r=".8"/></svg></span>Aide</button>
</div>

<div id="dock">
  <div id="dockhead">
    <button id="dockback" title="Retour"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <div id="docktitle">—</div><button id="dockclose">✕</button>
  </div>
  <div id="dockbody"></div>
</div>

<div id="legend">
  <div class="lg"><span class="sw" style="background:#1f4e79"></span> Ligne saine</div>
  <div class="lg"><span class="sw" style="background:#c8322a"></span> Ligne saturée</div>
  <div class="lg"><span class="sw" style="background:#7a5a9c"></span> Ligne déficitaire</div>
  <div class="lg"><span class="sw" style="background:#6f9bc0"></span> Ligne peu remplie</div>
  <div class="lg"><span class="sw" style="background:#b06a5e"></span> Lignes concurrentes</div>
  <div class="lg"><span class="sw" style="background:#a67c1a;height:9px;width:9px;border-radius:50%"></span> Votre hub</div>
  <div class="lg"><span class="sw" style="background:#26264a;opacity:.35;height:8px;width:14px;border-radius:3px"></span> Face nuit</div>
  <div class="lg" style="margin-top:7px;padding-top:7px;border-top:1px solid #e0d5bd;color:#8d8272">Clic sur une ville pour agir</div>
</div>

<div id="opts">
  <div class="oh">Affichage</div>
  <label><input type="checkbox" data-opt="dark"> Mode sombre</label>
  <label><input type="checkbox" data-opt="night"> Cycle jour / nuit</label>
  <label><input type="checkbox" data-opt="borders"> Frontières</label>
  <label><input type="checkbox" data-opt="lakes"> Lacs</label>
  <label><input type="checkbox" data-opt="rivals"> Lignes des concurrents</label>
  <label><input type="checkbox" data-opt="trails"> Traînées de condensation</label>
  <label><input type="checkbox" data-opt="halos"> Halos de trafic</label>
  <label><input type="checkbox" data-opt="labels"> Noms des villes</label>
  <label><input type="checkbox" data-opt="grain"> Grain du papier</label>
  <div class="oh" style="margin-top:9px">Projection</div>
  <div class="projs" id="projs"></div>
  <div class="mini" id="projNote" style="margin-top:5px;line-height:1.45"></div>
</div>

<div id="hud">
  <button id="optBtn" title="Options d’affichage"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6 3.5 3.5"/></svg></button>
  <button id="zIn" title="Zoom +">＋</button>
  <button id="zOut" title="Zoom −">−</button>
  <button id="zFit" title="Vue monde">⤢</button>
</div>

<div id="ticker"></div>
<div id="tip"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script src="js/data-land.js"></script>
<script src="js/data-world.js"></script>
<script src="js/data-game.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-stats.js"></script>
<script src="js/main.js"></script>
</body>
</html>
